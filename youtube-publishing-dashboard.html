<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Agent Studio</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#070b14;color:#e2e8f0;padding:24px}.wrap{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#101827;border:1px solid #293548;border-radius:16px;padding:18px}input,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin-top:8px;border-radius:9px;border:1px solid #334155;background:#080e19;color:white}button{background:#0891b2;font-weight:700;cursor:pointer}.job{border-top:1px solid #334155;padding:12px 0}.actions{display:flex;gap:8px}.actions button{flex:1}.danger{background:#9f1239}.approve{background:#059669}.muted{color:#94a3b8}.status{color:#67e8f9}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>YouTube Agent Studio</h1><p class="muted">Source research → review → explicit approval → official YouTube upload</p><div class="grid"><section class="card"><h2>Create research draft</h2><label>Topic<input id="topic" placeholder="Windows 11 hidden shortcut"></label><label>Channel ID<input id="channel" value="itcafeteria"></label><button id="create">Create dry-run draft</button><p id="created"></p></section><section class="card"><h2>Jobs</h2><button id="refresh">Refresh</button><div id="jobs"></div></section></div></div><script>const $=id=>document.getElementById(id);async function jobs(){const r=await fetch('/api/youtube-agent/jobs');const d=await r.json();$('jobs').innerHTML=(d.jobs||[]).map(j=>`<div class="job"><b>${j.title}</b><div class="status">${j.stage}</div><div class="muted">${j.topic}</div>${j.sources?.length?`<div class="muted">Sources: ${j.sources.length}</div>`:''}<div class="actions">${['draft_ready','media_pending','approval_pending'].includes(j.stage)?`<button class="approve" onclick="approve('${j.id}')">Approve</button>`:''}<button class="danger" onclick="cancel('${j.id}')">Cancel</button></div></div>`).join(''||'<p>No jobs</p>')}async function approve(id){const key=prompt('APP_ACCESS_KEY approval key:');if(!key)return;const r=await fetch('/api/youtube-agent/jobs/'+id+'/approve',{method:'POST',headers:{Authorization:'Bearer '+key}});const d=await r.json();alert(d.error||d.message||'Approved');jobs()}async function cancel(id){const key=prompt('APP_ACCESS_KEY approval key:');if(!key)return;await fetch('/api/youtube-agent/jobs/'+id+'/cancel',{method:'POST',headers:{Authorization:'Bearer '+key}});jobs()}$('create').onclick=async()=>{const r=await fetch('/api/youtube-agent/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:$('topic').value,channelId:$('channel').value,dryRun:true})});const d=await r.json();$('created').textContent=d.error||d.message||'Created';jobs()};$('refresh').onclick=jobs;jobs();</script></body></html>
